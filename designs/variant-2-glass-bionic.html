<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>VIS Tech • Neo-Glass Bionic Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --bg: #090D16;
            --glass-card: rgba(25, 33, 50, 0.55);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-glow: rgba(139, 92, 246, 0.2);
            --text-heading: #FFFFFF;
            --text-body: #94A3B8;
            --primary: #8B5CF6;
            --primary-light: #A78BFA;
            --accent-pink: #EC4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--text-body);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 80% 30%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
        }

        body.view-reader {
            background: #03060B !important;
            background-image: none !important;
        }

        .container {
            max-width: 1320px;
            margin: 0 auto;
            padding: 3.5rem 1.5rem 5rem;
        }

        /* HEADER */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
        }

        .pill-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1.1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 9999px;
            font-size: 0.78rem;
            font-weight: 700;
            color: #E2E8F0;
            margin-bottom: 1.25rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .pill-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            box-shadow: 0 0 8px #EC4899;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 6vw, 4.2rem);
            font-weight: 800;
            color: var(--text-heading);
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 0.85rem;
            background: linear-gradient(135deg, #FFFFFF 30%, #DDD6FE 70%, #F472B6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 1.1rem;
            color: #94A3B8;
            max-width: 650px;
            margin: 0 auto 2rem;
            line-height: 1.6;
        }

        /* COMMAND BAR TRIGGER */
        .spotlight-trigger {
            max-width: 640px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(25, 33, 50, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 0.75rem 1.25rem;
            cursor: pointer;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.25s ease;
        }

        .spotlight-trigger:hover {
            border-color: var(--primary-light);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.25);
            transform: translateY(-2px);
        }

        .spotlight-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #94A3B8;
            font-size: 0.95rem;
        }

        .kbd-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.2rem 0.55rem;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            color: #CBD5E1;
        }

        /* SPOTLIGHT MODAL */
        .spotlight-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(3, 6, 12, 0.8);
            backdrop-filter: blur(16px);
            z-index: 10000;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding-top: 10vh;
        }

        .spotlight-overlay.show {
            display: flex;
        }

        .spotlight-modal {
            width: 90%;
            max-width: 680px;
            background: #131A2A;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(139, 92, 246, 0.2);
        }

        .spotlight-header {
            display: flex;
            align-items: center;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .spotlight-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: var(--font-body);
            font-size: 1.1rem;
            color: #FFFFFF;
            margin-left: 0.75rem;
        }

        .spotlight-results {
            max-height: 380px;
            overflow-y: auto;
            padding: 0.5rem 0;
        }

        .spotlight-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.25rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .spotlight-item:hover, .spotlight-item.active {
            background: rgba(139, 92, 246, 0.15);
        }

        /* CHIPS */
        .theme-chips-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.65rem;
            padding: 0.5rem 0 2rem;
            max-width: 960px;
            margin: 0 auto;
        }

        .chip {
            padding: 0.45rem 1rem;
            border-radius: 9999px;
            font-size: 0.82rem;
            font-weight: 600;
            border: 1px solid var(--glass-border);
            background: var(--glass-card);
            color: #94A3B8;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            backdrop-filter: blur(12px);
        }

        .chip:hover {
            border-color: var(--primary-light);
            color: #FFFFFF;
        }

        .chip.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(236, 72, 153, 0.4));
            border-color: var(--primary-light);
            color: #FFFFFF;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        /* CARDS GRID */
        .folders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.75rem;
        }

        .folder-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .folder-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 25px rgba(139, 92, 246, 0.2);
        }

        .card-main {
            padding: 1.5rem 1.5rem 1rem;
            cursor: pointer;
            flex: 1;
        }

        .card-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .card-theme-tag {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: var(--font-mono);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-heading);
            line-height: 1.3;
            margin-bottom: 1rem;
        }

        /* MINI POSTER STRIP PREVIEW */
        .poster-preview-strip {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .poster-preview-strip::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        .mini-thumb {
            width: 55px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #111827;
            flex-shrink: 0;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .folder-card:hover .mini-thumb {
            border-color: rgba(255, 255, 255, 0.25);
        }

        .mini-thumb:hover {
            transform: scale(1.1);
            border-color: var(--primary-light) !important;
            z-index: 10;
        }

        .card-footer-row {
            padding: 0 1.5rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-open-stream {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            color: #FFFFFF;
            border: none;
            padding: 0.55rem 1.25rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
        }

        .btn-open-stream:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.45);
        }

        /* READER VIEW */
        #readerView {
            display: none;
            width: 100%;
            min-height: 100vh;
            background: #03060B;
        }

        .reader-nav {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            background: rgba(15, 17, 23, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            max-width: 95vw;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s ease;
        }

        .reader-nav.nav-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            transform: translateX(-50%) translateY(-24px) !important;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0.4rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.15s;
        }

        .nav-btn:hover {
            background: rgba(139, 92, 246, 0.3);
            border-color: var(--primary-light);
        }

        .doom-feed {
            width: 100%;
            display: flex;
            flex-direction: column;
            background: #03060B;
        }

        .article-frame {
            width: 100%;
            aspect-ratio: 1 / 3;
            background: #080C14;
            border-bottom: 2px solid #03060B;
            overflow: hidden;
        }

        .article-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.2s ease-out;
        }

        .article-img.is-loaded {
            opacity: 1;
        }
    </style>
</head>
<body class="view-home">
    <div id="homeView">
        <div class="container">
            <header class="hero">
                <div class="pill-badge">
                    <span class="pill-dot"></span>
                    <span>NEO-GLASS • BIONIC STREAM</span>
                </div>
                <h1 class="hero-title">Visual Knowledge Grid</h1>
                <p class="hero-desc">839 Infografik Sains Komputer &amp; Teknologi disusun dalam aliran vertikal tanpa hambatan.</p>

                <!-- SPOTLIGHT SEARCH TRIGGER -->
                <div class="spotlight-trigger" onclick="openSpotlight();">
                    <div class="spotlight-left">
                        <span>🔍</span>
                        <span>Cari topik, algoritma, atau konsep...</span>
                    </div>
                    <div class="kbd-badge">Ctrl + K</div>
                </div>

                <!-- THEME CHIPS -->
                <div class="theme-chips-bar" id="themeChipsBar"></div>
            </header>

            <main class="folders-grid" id="foldersGrid"></main>
        </div>
    </div>

    <!-- SPOTLIGHT MODAL -->
    <div class="spotlight-overlay" id="spotlightOverlay" onclick="closeSpotlight();">
        <div class="spotlight-modal" onclick="event.stopPropagation();">
            <div class="spotlight-header">
                <span>🔍</span>
                <input type="text" id="spotlightInput" class="spotlight-input" placeholder="Ketik apa saja untuk mencari..." autocomplete="off">
                <span class="kbd-badge" style="cursor:pointer;" onclick="closeSpotlight();">ESC</span>
            </div>
            <div class="spotlight-results" id="spotlightResults"></div>
        </div>
    </div>

    <!-- READER VIEW -->
    <div id="readerView">
        <nav class="reader-nav" id="readerNav" onclick="event.stopPropagation();">
            <button type="button" class="nav-btn" onclick="closeReader();">
                <span>← Kembali</span>
            </button>
            <span style="font-weight: 700; color: #FFFFFF; font-size: 0.92rem;" id="navFolderTitle">Judul Folder</span>
            <button type="button" class="nav-btn" onclick="toggleFullScreen();">
                <span>⛶</span>
            </button>
        </nav>
        <main class="doom-feed" id="doomFeed"></main>
    </div>

    <script src="../data.js"></script>
    <script>
        const libraryData = (window.libraryData || []).map(f => {
            if (f && f.images) {
                f.images.forEach(img => {
                    if (img && img.url && !img.url.startsWith('../')) img.url = '../' + img.url;
                });
            }
            return f;
        });

        const folderMap = {};
        libraryData.forEach(f => { folderMap[f.rawName] = f; });

        const homeView = document.getElementById('homeView');
        const readerView = document.getElementById('readerView');
        const foldersGrid = document.getElementById('foldersGrid');
        const themeChipsBar = document.getElementById('themeChipsBar');
        const doomFeed = document.getElementById('doomFeed');
        const nav = document.getElementById('readerNav');
        const navFolderTitle = document.getElementById('navFolderTitle');
        const spotlightOverlay = document.getElementById('spotlightOverlay');
        const spotlightInput = document.getElementById('spotlightInput');
        const spotlightResults = document.getElementById('spotlightResults');

        let currentActiveFolder = null;
        let homeScrollY = 0;
        let selectedTheme = '';

        function init() {
            // Chips
            const codes = [...new Set(libraryData.map(f => f.themeCode))];
            let chips = `<button class="chip active" data-theme="">✨ Semua (${libraryData.length})</button>`;
            codes.forEach(c => {
                const s = libraryData.find(f => f.themeCode === c);
                chips += `<button class="chip" data-theme="${c}">${s.theme.icon} ${s.themeShortTitle}</button>`;
            });
            themeChipsBar.innerHTML = chips;

            // Cards with Mini Poster Previews
            let cards = '';
            libraryData.forEach(f => {
                let thumbs = '';
                f.images.slice(0, 4).forEach(img => {
                    thumbs += `<img class="mini-thumb" src="${img.url}" alt="${img.cleanTitle}" title="${img.cleanTitle}" loading="lazy">`;
                });

                cards += `
                    <article class="folder-card" data-theme="${f.themeCode}" style="--theme-accent: ${f.theme.accent};">
                        <div class="card-main" onclick="openReader('${f.rawName}');">
                            <div class="card-header-top">
                                <span class="card-theme-tag" style="color: ${f.theme.accent};">${f.code} • ${f.themeShortTitle}</span>
                                <span>${f.theme.icon}</span>
                            </div>
                            <h2 class="card-title">${escapeHtml(f.displayName)}</h2>
                            <div class="poster-preview-strip">${thumbs}</div>
                        </div>
                        <div class="card-footer-row">
                            <span style="font-size: 0.8rem; color: #64748B; font-family: var(--font-mono);">${f.imageCount} Visual Cards</span>
                            <button type="button" class="btn-open-stream" onclick="openReader('${f.rawName}');">
                                <span>Buka Stream</span>
                                <span>→</span>
                            </button>
                        </div>
                    </article>
                `;
            });
            foldersGrid.innerHTML = cards;

            themeChipsBar.querySelectorAll('.chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    themeChipsBar.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedTheme = btn.dataset.theme || '';
                    foldersGrid.querySelectorAll('.folder-card').forEach(c => {
                        c.style.display = (!selectedTheme || c.dataset.theme === selectedTheme) ? 'flex' : 'none';
                    });
                });
            });
        }

        // Spotlight
        function openSpotlight() {
            spotlightOverlay.classList.add('show');
            spotlightInput.value = '';
            spotlightInput.focus();
            renderSpotlightMatches('');
        }
        function closeSpotlight() {
            spotlightOverlay.classList.remove('show');
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                openSpotlight();
            }
            if (e.key === 'Escape') closeSpotlight();
        });

        spotlightInput.addEventListener('input', () => {
            renderSpotlightMatches(spotlightInput.value.trim().toLowerCase());
        });

        function renderSpotlightMatches(q) {
            const matches = [];
            libraryData.forEach(f => {
                f.images.forEach((img, i) => {
                    if (!q || img.cleanTitle.toLowerCase().includes(q) || f.displayName.toLowerCase().includes(q)) {
                        matches.push({ folder: f, img, idx: i + 1 });
                    }
                });
            });

            if (matches.length === 0) {
                spotlightResults.innerHTML = '<div style="padding: 2rem; text-align:center; color:#64748B;">Tidak ada hasil ditemukan.</div>';
                return;
            }

            let html = '';
            matches.slice(0, 8).forEach(m => {
                html += `
                    <div class="spotlight-item" onclick="openReader('${m.folder.rawName}', ${m.idx}); closeSpotlight();">
                        <span style="font-size: 1.25rem;">${m.folder.theme.icon}</span>
                        <div style="flex:1;">
                            <div style="font-weight: 600; color:#FFFFFF; font-size:0.95rem;">${escapeHtml(m.img.cleanTitle)}</div>
                            <div style="font-size: 0.75rem; color:#94A3B8;">${m.folder.code} • ${escapeHtml(m.folder.displayName)} #${m.idx}</div>
                        </div>
                        <span style="color:#8B5CF6;">→</span>
                    </div>
                `;
            });
            spotlightResults.innerHTML = html;
        }

        // Visibility Controls (Default: lenyap, toggle via tap/click)
        function showNav() { nav.classList.remove('nav-hidden'); }
        function hideNav() { nav.classList.add('nav-hidden'); }
        function toggleNav() {
            if (nav.classList.contains('nav-hidden')) showNav();
            else hideNav();
        }

        // Reader
        function openReader(rawName, targetIdx) {
            const f = folderMap[rawName];
            if (!f) return;
            homeScrollY = window.scrollY;
            currentActiveFolder = f;
            document.body.className = 'view-reader';
            homeView.style.display = 'none';
            readerView.style.display = 'block';
            navFolderTitle.textContent = f.displayName;

            hideNav();

            let feed = '';
            f.images.forEach((img, i) => {
                feed += `
                    <section class="article-frame" id="art-${i+1}" data-index="${i+1}">
                        <img class="article-img" data-src="${img.url}" alt="${img.cleanTitle}" loading="lazy">
                    </section>
                `;
            });
            doomFeed.innerHTML = feed;
            preload(targetIdx || 1);

            if (targetIdx > 0) {
                const target = document.getElementById('art-' + targetIdx);
                if (target) target.scrollIntoView({ behavior: 'instant' });
            } else {
                window.scrollTo({ top: 0, behavior: 'instant' });
            }
        }

        function closeReader() {
            currentActiveFolder = null;
            document.body.className = 'view-home';
            readerView.style.display = 'none';
            homeView.style.display = 'block';
            window.scrollTo({ top: homeScrollY, behavior: 'instant' });
        }

        function preload(idx) {
            if (!currentActiveFolder) return;
            for (let i = Math.max(1, idx - 2); i <= Math.min(currentActiveFolder.images.length, idx + 6); i++) {
                const fr = document.getElementById('art-' + i);
                if (fr) {
                    const img = fr.querySelector('img');
                    if (img && img.dataset.src && img.src !== img.dataset.src) {
                        img.src = img.dataset.src;
                        img.onload = () => img.classList.add('is-loaded');
                    }
                }
            }
        }

        window.addEventListener('scroll', () => {
            if (!currentActiveFolder) return;
            if (!nav.classList.contains('nav-hidden')) {
                hideNav();
            }
            const frames = doomFeed.querySelectorAll('.article-frame');
            const midY = window.innerHeight * 0.35;
            for (let i = 0; i < frames.length; i++) {
                const rect = frames[i].getBoundingClientRect();
                if (rect.top <= midY && rect.bottom >= midY) {
                    const idx = parseInt(frames[i].dataset.index, 10);
                    preload(idx);
                    break;
                }
            }
        }, { passive: true });

        document.addEventListener('click', (e) => {
            if (!currentActiveFolder) return;
            if (e.target.closest('#readerNav')) return;
            if (e.clientY <= 90) {
                toggleNav();
            } else {
                hideNav();
            }
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
            else document.exitFullscreen().catch(()=>{});
        }
        function escapeHtml(s) { return s ? s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''; }

        init();
    </script>
</body>
</html>
