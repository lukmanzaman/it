<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>VIS Computer Science &amp; Technology • Editorial Studio</title>
    <meta name="description" content="Eksplorasi visual 839+ konsep sains komputer, AI, algoritma, data science, dan cybersecurity dalam format continuous vertical stream & dual-pane studio.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --bg: #FFF5F7;
            --sidebar: #FFFFFF;
            --panel: #FFFFFF;
            --border: #FCE7F3;
            --text-heading: #831843;
            --text-body: #701A75;
            --text-muted: #9D174D;
            --pink-primary: #F43F5E;
            --pink-glow: rgba(244, 63, 94, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--text-body);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body.view-reader {
            background: #180914 !important;
        }

        .studio-layout {
            display: grid;
            grid-template-columns: 430px 1fr;
            min-height: 100vh;
        }

        @media (max-width: 1024px) {
            .studio-layout {
                grid-template-columns: 1fr;
            }
        }

        /* LEFT SIDEBAR: TOPIC EXPLORER */
        .sidebar {
            background: var(--sidebar);
            border-right: 1.5px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow: hidden;
            box-shadow: 4px 0 20px rgba(244, 114, 182, 0.08);
        }

        @media (max-width: 1024px) {
            .sidebar {
                height: auto;
                position: relative;
            }
        }

        .sidebar-header {
            padding: 2rem 1.75rem 1.5rem;
            border-bottom: 1.5px dashed var(--border);
            background: linear-gradient(180deg, #FFF0F5 0%, #FFFFFF 100%);
        }

        .brand-badge {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            color: #BE185D;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .brand-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 800;
            color: #831843;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        .brand-sub {
            font-size: 0.85rem;
            color: #9D174D;
        }

        .sidebar-search {
            padding: 1rem 1.75rem;
            border-bottom: 1.5px solid var(--border);
        }

        .search-input-box {
            display: flex;
            align-items: center;
            background: #FFF5F7;
            border: 1.5px solid #FBCFE8;
            border-radius: 9999px;
            padding: 0.55rem 1rem;
            gap: 0.5rem;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #831843;
            font-size: 0.9rem;
            font-family: var(--font-body);
            font-weight: 500;
        }

        .search-input::placeholder {
            color: #F472B6;
        }

        .topic-list-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0.85rem;
        }

        .topic-item {
            padding: 1rem 1.25rem;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.4rem;
            border: 1.5px solid transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topic-item:hover {
            background: #FFF0F5;
        }

        .topic-item.active {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.12), rgba(236, 72, 153, 0.12));
            border-color: #F472B6;
            box-shadow: 0 4px 15px rgba(244, 114, 182, 0.2);
        }

        .topic-item-left {
            flex: 1;
            min-width: 0;
        }

        .topic-item-code {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            color: #BE185D;
            margin-bottom: 0.2rem;
        }

        .topic-item-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #831843;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topic-item-count {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            color: #BE185D;
            background: #FFF0F5;
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            border: 1px solid #FBCFE8;
            margin-left: 0.75rem;
        }

        /* RIGHT CANVAS: MOODBOARD & SHOWCASE */
        .canvas-area {
            padding: 3.5rem;
            overflow-y: auto;
            max-width: 1100px;
        }

        @media (max-width: 600px) {
            .canvas-area {
                padding: 1.5rem;
            }
        }

        .canvas-header {
            margin-bottom: 2.5rem;
            border-bottom: 2px dashed #FBCFE8;
            padding-bottom: 2rem;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .canvas-topic-meta {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            color: #BE185D;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.5rem;
        }

        .canvas-topic-title {
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 4vw, 3.4rem);
            font-weight: 800;
            color: #831843;
            line-height: 1.15;
            letter-spacing: -0.03em;
        }

        .btn-launch-full {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #F43F5E, #EC4899);
            color: #FFFFFF;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1rem;
            padding: 0.8rem 1.85rem;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.4);
        }

        .btn-launch-full:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 8px 25px rgba(244, 63, 94, 0.55);
        }

        /* POSTER SHOWCASE CAROUSEL / GRID */
        .poster-canvas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.75rem;
        }

        .canvas-poster-card {
            background: #FFFFFF;
            border: 1.5px solid #FCE7F3;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 8px 20px rgba(244, 114, 182, 0.1);
        }

        .canvas-poster-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #F472B6;
            box-shadow: 0 20px 40px rgba(244, 63, 94, 0.25), 0 0 20px rgba(251, 207, 232, 0.6);
        }

        .canvas-poster-img-box {
            aspect-ratio: 1 / 3;
            overflow: hidden;
            background: #FFF0F5;
        }

        .canvas-poster-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .canvas-poster-card:hover .canvas-poster-img-box img {
            transform: scale(1.06);
        }

        .canvas-poster-info {
            padding: 1.15rem;
            background: #FFFFFF;
            border-top: 1.5px solid #FCE7F3;
        }

        .canvas-poster-num {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: #BE185D;
            font-weight: 700;
        }

        .canvas-poster-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #831843;
            margin-top: 0.25rem;
            line-height: 1.35;
        }

        /* READER VIEW */
        #readerView {
            display: none;
            width: 100%;
            min-height: 100vh;
            background-color: #180914;
        }

        .reader-nav {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            background: rgba(36, 12, 30, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            border: 1px solid rgba(244, 114, 182, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(244, 114, 182, 0.2);
            max-width: 95vw;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s ease;
        }

        .reader-nav.nav-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            transform: translateX(-50%) translateY(-24px) !important;
        }

        .nav-back-btn, .nav-fullscreen-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.15s ease;
        }

        .nav-back-btn:hover, .nav-fullscreen-btn:hover {
            background: rgba(244, 63, 94, 0.4);
            border-color: #FB7185;
        }

        .nav-title-text {
            font-size: 0.88rem;
            font-weight: 700;
            color: #FFFFFF;
            max-width: 240px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-picker-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #FFFFFF;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.15s ease;
        }

        .nav-picker-btn:hover, .nav-picker-btn.active {
            background: #FFFFFF;
            color: #831843;
        }

        .nav-picker-dropdown {
            position: absolute;
            top: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            background: #240C1E;
            border: 1.5px solid rgba(244, 114, 182, 0.3);
            border-radius: 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: none;
            z-index: 10001;
        }

        .nav-picker-dropdown.show {
            display: block;
        }

        .nav-picker-header {
            padding: 0.55rem 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.72rem;
            font-weight: 700;
            color: #F472B6;
            display: flex;
            justify-content: space-between;
        }

        .picker-total-badge {
            background: rgba(244, 63, 94, 0.3);
            color: #FFFFFF;
            padding: 0.1rem 0.45rem;
            border-radius: 9999px;
            font-size: 0.68rem;
        }

        .nav-picker-list {
            max-height: 240px;
            overflow-y: auto;
            padding: 0.3rem 0;
        }

        .nav-picker-list::-webkit-scrollbar {
            width: 5px;
        }
        .nav-picker-list::-webkit-scrollbar-thumb {
            background: rgba(244, 114, 182, 0.3);
            border-radius: 4px;
        }

        .nav-picker-item {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.5rem 0.85rem;
            color: #CBD5E1;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-picker-item:hover {
            background: rgba(244, 114, 182, 0.15);
            color: #FFFFFF;
        }

        .nav-picker-item.active {
            background: linear-gradient(135deg, #F43F5E, #EC4899);
            color: #FFFFFF;
            font-weight: 700;
        }

        .picker-item-num {
            font-size: 0.7rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: #F472B6;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
        }

        .nav-picker-item.active .picker-item-num {
            background: rgba(255, 255, 255, 0.25);
            color: #FFFFFF;
        }

        .picker-item-title {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .restore-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: rgba(36, 12, 30, 0.95);
            color: #F472B6;
            border: 1.5px solid rgba(244, 114, 182, 0.4);
            padding: 0.6rem 1.4rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(244, 114, 182, 0.3);
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .restore-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .doom-feed {
            width: 100%;
            display: flex;
            flex-direction: column;
            background-color: #180914;
        }

        .article-frame {
            width: 100%;
            aspect-ratio: 1 / 3;
            background-color: #240C1E;
            border-bottom: 2px solid #180914;
            overflow: hidden;
        }

        .article-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.2s ease-out;
        }

        .article-img.is-loaded {
            opacity: 1;
        }
    </style>
</head>
<body class="view-home">
    <div id="homeView">
        <div class="studio-layout">
            <!-- SIDEBAR: TOPIC EXPLORER -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="brand-badge">VIS • COMPUTER SCIENCE &amp; TECH</div>
                    <h1 class="brand-title">Computer Science</h1>
                    <p class="brand-sub">Eksplorasi visual konsep sains komputer, AI, algoritma, dan rekayasa perangkat lunak.</p>
                </div>

                <div class="sidebar-search">
                    <div class="search-input-box">
                        <span style="font-size: 0.9rem; opacity: 0.7;">🔍</span>
                        <input type="text" id="sidebarSearch" class="search-input" placeholder="Cari topik atau materi...">
                    </div>
                </div>

                <div class="topic-list-scroll" id="topicListScroll"></div>
            </aside>

            <!-- RIGHT CANVAS -->
            <main class="canvas-area">
                <div class="canvas-header">
                    <div>
                        <div class="canvas-topic-meta" id="canvasMeta">E1-01 • HISTORY OF COMPUTING</div>
                        <h2 class="canvas-topic-title" id="canvasTitle">History of Computing</h2>
                    </div>
                    <button type="button" class="btn-launch-full" id="btnLaunchCanvasStream">
                        <span>Buka Stream</span>
                    </button>
                </div>

                <div class="poster-canvas-grid" id="posterCanvasGrid"></div>
            </main>
        </div>
    </div>

    <!-- READER -->
    <div id="readerView">
        <nav class="reader-nav" id="readerNav" onclick="event.stopPropagation();">
            <button type="button" class="nav-back-btn" onclick="closeReader();">
                <span>← Kembali</span>
            </button>
            <span class="nav-title-text" id="navFolderTitle">Judul Folder</span>

            <!-- Jump Picker Dropdown -->
            <div style="position: relative;">
                <button type="button" class="nav-picker-btn" id="navPickerBtn" onclick="togglePickerDropdown();">
                    <span id="navPickerLabel">#1 Judul Artikel</span>
                    <span>▾</span>
                </button>
                <div class="nav-picker-dropdown" id="navPickerDropdown">
                    <div class="nav-picker-header">
                        <span>PILIH ARTIKEL</span>
                        <span class="picker-total-badge" id="pickerTotalBadge">0 Item</span>
                    </div>
                    <div class="nav-picker-list" id="navPickerList"></div>
                </div>
            </div>

            <button type="button" class="nav-fullscreen-btn" onclick="toggleFullScreen();">
                <span>⛶</span>
            </button>
        </nav>
        <main class="doom-feed" id="doomFeed"></main>
        <div class="restore-toast" id="restoreToast">
            <span id="restoreToastText">Melanjutkan membaca...</span>
        </div>
    </div>

    <script src="../data.js"></script>
    <script>
        const libraryData = (window.libraryData || []).map(f => {
            if (f && f.images) {
                f.images.forEach(img => {
                    if (img && img.url && !img.url.startsWith('../')) img.url = '../' + img.url;
                });
            }
            return f;
        });

        const folderMap = {};
        libraryData.forEach(f => { folderMap[f.rawName] = f; });

        const homeView = document.getElementById('homeView');
        const readerView = document.getElementById('readerView');
        const topicListScroll = document.getElementById('topicListScroll');
        const sidebarSearch = document.getElementById('sidebarSearch');
        const canvasMeta = document.getElementById('canvasMeta');
        const canvasTitle = document.getElementById('canvasTitle');
        const btnLaunchCanvasStream = document.getElementById('btnLaunchCanvasStream');
        const posterCanvasGrid = document.getElementById('posterCanvasGrid');
        const doomFeed = document.getElementById('doomFeed');
        const nav = document.getElementById('readerNav');
        const navFolderTitle = document.getElementById('navFolderTitle');
        const navPickerBtn = document.getElementById('navPickerBtn');
        const navPickerDropdown = document.getElementById('navPickerDropdown');
        const navPickerLabel = document.getElementById('navPickerLabel');
        const navPickerList = document.getElementById('navPickerList');
        const pickerTotalBadge = document.getElementById('pickerTotalBadge');

        let currentActiveFolder = null;
        let selectedFolder = libraryData[0];
        let homeScrollY = 0;

        function showNav() { nav.classList.remove('nav-hidden'); }
        function hideNav() { 
            nav.classList.add('nav-hidden'); 
            closePickerDropdown();
        }
        function toggleNav() {
            if (nav.classList.contains('nav-hidden')) showNav();
            else hideNav();
        }

        function togglePickerDropdown() {
            navPickerDropdown.classList.toggle('show');
            navPickerBtn.classList.toggle('active');
        }

        function closePickerDropdown() {
            if (navPickerDropdown) navPickerDropdown.classList.remove('show');
            if (navPickerBtn) navPickerBtn.classList.remove('active');
        }

        function updateActiveArticleState(artNum) {
            if (!currentActiveFolder || !currentActiveFolder.images) return;
            currentActiveArtIdx = artNum;
            const curItem = currentActiveFolder.images[artNum - 1];
            if (curItem && navPickerLabel) {
                navPickerLabel.textContent = `#${artNum} ${curItem.cleanTitle}`;
            }

            if (navPickerList) {
                const items = navPickerList.querySelectorAll('.nav-picker-item');
                items.forEach(it => {
                    if (parseInt(it.getAttribute('data-idx'), 10) === artNum) {
                        it.classList.add('active');
                        it.scrollIntoView({ block: 'nearest' });
                    } else {
                        it.classList.remove('active');
                    }
                });
            }
        }

        function init() {
            renderSidebar();
            selectTopic(libraryData[0].rawName);

            sidebarSearch.addEventListener('input', renderSidebar);
            btnLaunchCanvasStream.addEventListener('click', () => {
                if (selectedFolder) openReader(selectedFolder.rawName);
            });
        }

        function renderSidebar() {
            const q = sidebarSearch.value.trim().toLowerCase();
            let html = '';
            libraryData.forEach(f => {
                if (q && !f.displayName.toLowerCase().includes(q) && !f.images.some(img => img.cleanTitle.toLowerCase().includes(q))) return;
                const isActive = selectedFolder && selectedFolder.rawName === f.rawName;
                html += `
                    <div class="topic-item ${isActive ? 'active' : ''}" onclick="selectTopic('${f.rawName}');">
                        <div class="topic-item-left">
                            <div class="topic-item-code">${f.code} • ${f.themeShortTitle}</div>
                            <div class="topic-item-title">${escapeHtml(f.displayName)}</div>
                        </div>
                        <span class="topic-item-count">${f.imageCount}</span>
                    </div>
                `;
            });
            topicListScroll.innerHTML = html;
        }

        function selectTopic(rawName) {
            const f = folderMap[rawName];
            if (!f) return;
            selectedFolder = f;

            document.querySelectorAll('.topic-item').forEach(it => {
                it.classList.remove('active');
            });
            renderSidebar();

            canvasMeta.textContent = `${f.code} • ${f.themeTitle.toUpperCase()}`;
            canvasTitle.textContent = f.displayName;

            let postersHtml = '';
            f.images.forEach((img, i) => {
                postersHtml += `
                    <div class="canvas-poster-card" onclick="openReader('${f.rawName}', ${i + 1});">
                        <div class="canvas-poster-img-box">
                            <img src="${img.url}" alt="${escapeHtml(img.cleanTitle)}" loading="lazy" decoding="async">
                        </div>
                        <div class="canvas-poster-info">
                            <div class="canvas-poster-num">#${i + 1}</div>
                            <div class="canvas-poster-title">${escapeHtml(img.cleanTitle)}</div>
                        </div>
                    </div>
                `;
            });
            posterCanvasGrid.innerHTML = postersHtml;
        }

        // Independent Position Store per Folder (LocalStorage)
        let folderPositions = {};
        let currentActiveArtIdx = 1;
        let isRestoringScroll = false;
        let saveScrollTimeout = null;

        function loadAllPositions() {
            let loaded = {};
            try {
                const raw = localStorage.getItem('vis_tech_positions');
                if (raw) loaded = JSON.parse(raw) || {};
            } catch(e) {}
            return loaded;
        }
        folderPositions = loadAllPositions();

        function saveCurrentPosition() {
            if (!currentActiveFolder || isRestoringScroll) return;
            const fKey = currentActiveFolder.rawName;
            const artIdx = currentActiveArtIdx || 1;
            const scrollY = Math.round(window.scrollY);

            folderPositions[fKey] = {
                artIdx: artIdx,
                scrollY: scrollY,
                total: currentActiveFolder.imageCount,
                ts: Date.now()
            };
            try { localStorage.setItem('vis_tech_positions', JSON.stringify(folderPositions)); } catch(e) {}
        }

        window.addEventListener('beforeunload', () => saveCurrentPosition());
        window.addEventListener('pagehide', () => saveCurrentPosition());

        function showToast(msg) {
            const toast = document.getElementById('restoreToast');
            const toastText = document.getElementById('restoreToastText');
            if (toast && toastText) {
                toastText.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 2500);
            }
        }

        // Smart Proactive Image Preloader & Lazy Observer
        let imageObserver = null;
        const preloadedUrls = new Set();
        function preloadImageUrl(url) {
            if (!url || preloadedUrls.has(url)) return;
            preloadedUrls.add(url);
            const temp = new Image();
            temp.decoding = 'async';
            temp.src = url;
        }

        function loadFrameImage(idx) {
            if (!currentActiveFolder || !currentActiveFolder.images) return;
            if (idx < 1 || idx > currentActiveFolder.images.length) return;

            const frame = document.getElementById('art-' + idx);
            if (!frame) return;

            const img = frame.querySelector('img.article-img');
            if (!img) return;

            const realSrc = img.getAttribute('data-src');
            if (!realSrc) return;

            if (img.src !== realSrc) {
                img.src = realSrc;
            }

            if (img.complete && img.naturalWidth > 0) {
                img.classList.add('is-loaded');
            } else {
                img.onload = () => { img.classList.add('is-loaded'); };
            }
        }

        function preloadRunway(currentIdx) {
            if (!currentActiveFolder || !currentActiveFolder.images) return;
            const total = currentActiveFolder.images.length;
            const start = Math.max(1, currentIdx - 2);
            const end = Math.min(total, currentIdx + 6);

            for (let i = start; i <= end; i++) {
                loadFrameImage(i);
                const item = currentActiveFolder.images[i - 1];
                if (item && item.url) preloadImageUrl(item.url);
            }
        }

        function setupLazyObserver() {
            const lazyImages = doomFeed.querySelectorAll('.lazy-img');
            if ('IntersectionObserver' in window) {
                if (imageObserver) imageObserver.disconnect();
                imageObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            const idx = parseInt(img.closest('.article-frame')?.getAttribute('data-index'), 10);
                            if (idx) preloadRunway(idx);
                        }
                    });
                }, { rootMargin: '600px 0px' });

                lazyImages.forEach(img => imageObserver.observe(img));
            } else {
                for (let i = 1; i <= Math.min(10, currentActiveFolder.images.length); i++) {
                    loadFrameImage(i);
                }
            }
        }

        function jumpToArticle(artNum, behavior = 'smooth') {
            const frame = document.getElementById('art-' + artNum);
            if (frame) {
                preloadRunway(artNum);
                frame.scrollIntoView({ behavior: behavior, block: 'start' });
                updateActiveArticleState(artNum);
            }
        }

        function openReader(rawName, targetIdx) {
            const f = folderMap[rawName];
            if (!f) return;
            homeScrollY = window.scrollY;
            currentActiveFolder = f;

            document.body.className = 'view-reader';
            homeView.style.display = 'none';
            readerView.style.display = 'block';
            navFolderTitle.textContent = f.displayName;

            hideNav();

            if (pickerTotalBadge) pickerTotalBadge.textContent = `${f.imageCount} Poster`;
            if (navPickerList) {
                navPickerList.innerHTML = '';
                f.images.forEach((img, idx) => {
                    const itemNum = idx + 1;
                    const div = document.createElement('div');
                    div.className = 'nav-picker-item' + (itemNum === 1 ? ' active' : '');
                    div.setAttribute('data-idx', itemNum);
                    div.innerHTML = `<span class="picker-item-num">#${itemNum}</span><span class="picker-item-title">${escapeHtml(img.cleanTitle)}</span>`;
                    div.onclick = (e) => {
                        e.stopPropagation();
                        jumpToArticle(itemNum);
                        closePickerDropdown();
                    };
                    navPickerList.appendChild(div);
                });
            }

            let feed = '';
            f.images.forEach((img, i) => {
                feed += `
                    <section class="article-frame" id="art-${i+1}" data-index="${i+1}">
                        <img 
                            class="article-img lazy-img" 
                            data-src="${img.url}" 
                            alt="${escapeHtml(img.cleanTitle)}" 
                            loading="lazy" 
                            decoding="async"
                        >
                    </section>
                `;
            });
            doomFeed.innerHTML = feed;

            setupLazyObserver();

            let savedPos = folderPositions[f.rawName];
            let startIdx = targetIdx > 0 ? targetIdx : (savedPos ? savedPos.artIdx : 1);
            preloadRunway(startIdx);

            if (targetIdx > 0) {
                jumpToArticle(targetIdx, 'instant');
            } else if (savedPos && savedPos.scrollY > 0) {
                isRestoringScroll = true;
                setTimeout(() => {
                    window.scrollTo({ top: savedPos.scrollY, behavior: 'instant' });
                    preloadRunway(savedPos.artIdx);
                    updateActiveArticleState(savedPos.artIdx);
                    showToast(`Melanjutkan dari artikel #${savedPos.artIdx}`);
                    setTimeout(() => { isRestoringScroll = false; }, 300);
                }, 50);
            } else {
                window.scrollTo({ top: 0, behavior: 'instant' });
                updateActiveArticleState(1);
            }
        }

        function closeReader() {
            if (currentActiveFolder) saveCurrentPosition();
            currentActiveFolder = null;
            closePickerDropdown();

            if (imageObserver) {
                imageObserver.disconnect();
                imageObserver = null;
            }

            document.body.className = 'view-home';
            readerView.style.display = 'none';
            homeView.style.display = 'block';
            window.scrollTo({ top: homeScrollY, behavior: 'instant' });
        }

        window.addEventListener('scroll', () => {
            if (!currentActiveFolder || isRestoringScroll) return;
            if (!nav.classList.contains('nav-hidden')) {
                hideNav();
            }
            const frames = doomFeed.querySelectorAll('.article-frame');
            const midY = window.innerHeight * 0.35;
            for (let i = 0; i < frames.length; i++) {
                const rect = frames[i].getBoundingClientRect();
                if (rect.top <= midY && rect.bottom >= midY) {
                    const idx = parseInt(frames[i].dataset.index, 10);
                    if (idx !== currentActiveArtIdx) {
                        updateActiveArticleState(idx);
                        preloadRunway(idx);
                    }
                    break;
                }
            }

            if (saveScrollTimeout) clearTimeout(saveScrollTimeout);
            saveScrollTimeout = setTimeout(() => {
                if (!currentActiveFolder || isRestoringScroll) return;
                saveCurrentPosition();
            }, 100);
        }, { passive: true });

        document.addEventListener('click', (e) => {
            if (!currentActiveFolder) return;
            if (e.target.closest('#readerNav') || e.target.closest('#restoreToast')) return;
            if (e.clientY <= 90) {
                toggleNav();
            } else {
                hideNav();
            }
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
            else document.exitFullscreen().catch(()=>{});
        }
        function escapeHtml(s) { return s ? s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''; }

        init();
    </script>
</body>
</html>
