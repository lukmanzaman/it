<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>VIS Computer Science &amp; Technology • 3D Gallery &amp; Poster Wall</title>
    <meta name="description" content="Eksplorasi visual 839+ konsep sains komputer, kecerdasan buatan, arsitektur data, dan keamanan siber.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --bg: #FFF5F7;
            --surface: #FFFFFF;
            --surface-card: rgba(255, 255, 255, 0.85);
            --border: #FCE7F3;
            --border-glow: #F472B6;
            --text-heading: #831843;
            --text-body: #701A75;
            --text-muted: #9D174D;
            --pink-primary: #F43F5E;
            --pink-soft: #FB7185;
            --pink-light: #FBCFE8;
            --pink-glow: rgba(244, 63, 94, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--text-body);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(244, 114, 182, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 25%, rgba(251, 113, 133, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(244, 63, 94, 0.15) 0%, transparent 50%),
                radial-gradient(rgba(244, 114, 182, 0.12) 1.5px, transparent 1.5px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 28px 28px;
            background-attachment: fixed;
        }

        body.view-reader {
            background: #180914 !important;
            background-image: none !important;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 6rem;
        }

        /* 3D SPATIAL HERO STAGE */
        .spatial-hero {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 3rem;
            align-items: center;
            padding: 3rem 0 4rem;
            border-bottom: 2px dashed #FBCFE8;
            margin-bottom: 3.5rem;
            perspective: 1200px;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
        }

        @media (max-width: 960px) {
            .spatial-hero {
                grid-template-columns: 1fr;
                gap: 2.5rem;
                text-align: center;
            }
        }

        .hero-left {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 1.15rem;
            background: #FFF0F5;
            border: 1.5px solid #F472B6;
            border-radius: 9999px;
            font-size: 0.78rem;
            font-family: var(--font-mono);
            font-weight: 700;
            color: #BE185D;
            letter-spacing: 0.08em;
            width: fit-content;
            box-shadow: 0 4px 15px rgba(244, 114, 182, 0.25);
        }

        @media (max-width: 960px) {
            .hero-badge {
                margin: 0 auto;
            }
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(2.8rem, 6vw, 4.6rem);
            font-weight: 800;
            color: var(--text-heading);
            line-height: 1.08;
            letter-spacing: -0.03em;
        }

        .hero-title span {
            background: linear-gradient(135deg, #E11D48 0%, #DB2777 50%, #C026D3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(244, 63, 94, 0.2);
        }

        .hero-desc {
            font-size: 1.1rem;
            color: #9D174D;
            line-height: 1.65;
            max-width: 540px;
        }

        @media (max-width: 960px) {
            .hero-desc {
                margin: 0 auto;
            }
        }

        /* 3D TILTED POSTER DECK IN HERO */
        .poster-deck-3d {
            position: relative;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            transform: rotateY(-10deg) rotateX(6deg);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .poster-deck-3d:hover {
            transform: rotateY(-2deg) rotateX(2deg) scale(1.03);
        }

        @media (max-width: 768px) {
            .poster-deck-3d {
                height: 270px;
                transform: scale(0.72) rotateY(-6deg) rotateX(4deg);
            }
        }

        @media (max-width: 480px) {
            .poster-deck-3d {
                height: 230px;
                transform: scale(0.62) rotateY(-4deg) rotateX(2deg);
            }
        }

        .deck-card {
            position: absolute;
            width: 140px;
            height: 320px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(190, 24, 93, 0.18), 0 0 25px rgba(244, 114, 182, 0.35);
            border: 2px solid #FFFFFF;
            background: #FFF;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .deck-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .deck-card:hover {
            transform: translateY(-22px) scale(1.12) !important;
            z-index: 100 !important;
            box-shadow: 0 30px 50px rgba(190, 24, 93, 0.3), 0 0 35px rgba(244, 63, 94, 0.6);
            border-color: #F43F5E;
        }

        .deck-card.c1 { transform: translateX(-160px) rotateZ(-12deg) translateY(10px); z-index: 1; }
        .deck-card.c2 { transform: translateX(-80px) rotateZ(-6deg) translateY(5px); z-index: 2; }
        .deck-card.c3 { transform: translateX(0px) rotateZ(0deg); z-index: 3; border-color: #F43F5E; box-shadow: 0 25px 45px rgba(190, 24, 93, 0.25), 0 0 30px rgba(244, 63, 94, 0.4); }
        .deck-card.c4 { transform: translateX(80px) rotateZ(6deg) translateY(5px); z-index: 2; }
        .deck-card.c5 { transform: translateX(160px) rotateZ(12deg) translateY(10px); z-index: 1; }

        /* VIEW SWITCHER & SEARCH TOOLBAR */
        .controls-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            width: 100%;
            max-width: 100%;
        }

        @media (max-width: 768px) {
            .controls-toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }
            .view-tabs {
                width: 100%;
            }
            .view-tab-btn {
                flex: 1;
                justify-content: center;
                padding: 0.5rem 0.5rem;
                font-size: 0.8rem;
            }
            .search-pill-box {
                max-width: 100%;
            }
        }

        .view-tabs {
            display: flex;
            background: #FFFFFF;
            padding: 0.4rem;
            border-radius: 9999px;
            border: 1.5px solid #FBCFE8;
            box-shadow: 0 4px 15px rgba(244, 114, 182, 0.15);
            gap: 0.35rem;
        }

        .view-tab-btn {
            background: transparent;
            border: none;
            color: #9D174D;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.88rem;
            padding: 0.55rem 1.35rem;
            border-radius: 9999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .view-tab-btn.active {
            background: linear-gradient(135deg, #F43F5E, #DB2777);
            color: #FFFFFF;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.35);
        }

        .search-pill-box {
            display: flex;
            align-items: center;
            background: #FFFFFF;
            border: 1.5px solid #FBCFE8;
            border-radius: 9999px;
            padding: 0.6rem 1.35rem;
            gap: 0.75rem;
            min-width: 0; width: 100%;
            flex: 1;
            max-width: 480px;
            box-shadow: 0 4px 15px rgba(244, 114, 182, 0.12);
            transition: all 0.2s;
        }

        .search-pill-box:focus-within {
            border-color: #F43F5E;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.25);
        }

        .search-pill-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #831843;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .search-pill-input::placeholder {
            color: #F472B6;
        }

        /* CATEGORY FILTER CAPSULES */
        .category-capsules {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin-bottom: 3rem;
            justify-content: center;
        }

        .capsule-btn {
            padding: 0.55rem 1.25rem;
            border-radius: 9999px;
            background: #FFFFFF;
            border: 1.5px solid #FCE7F3;
            color: #9D174D;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            box-shadow: 0 2px 8px rgba(244, 114, 182, 0.1);
            transition: all 0.2s;
        }

        .capsule-btn:hover {
            border-color: #F472B6;
            color: #831843;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(244, 114, 182, 0.2);
        }

        .capsule-btn.active {
            background: linear-gradient(135deg, #F43F5E, #EC4899);
            border-color: #F43F5E;
            color: #FFFFFF;
            box-shadow: 0 4px 18px rgba(244, 63, 94, 0.35);
        }

        /* EXHIBITS GRID */
        .exhibits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        @media (max-width: 500px) {
            .exhibits-grid {
                grid-template-columns: 1fr;
            }
        }

        .exhibit-card {
            background: #FFFFFF;
            border: 1.5px solid #FCE7F3;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.1);
        }

        .exhibit-card:hover {
            transform: translateY(-8px);
            border-color: #F472B6;
            box-shadow: 0 20px 40px rgba(244, 63, 94, 0.2), 0 0 25px rgba(251, 207, 232, 0.6);
        }

        /* POSTER TRIPLE-STAGE BANNER */
        .exhibit-poster-stage {
            height: 220px;
            background: #FFF0F5;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 1rem;
            cursor: pointer;
            border-bottom: 1.5px solid #FCE7F3;
        }

        .stage-thumb {
            height: 100%;
            width: 75px;
            border-radius: 10px;
            object-fit: cover;
            border: 1.5px solid #FFFFFF;
            box-shadow: 0 8px 18px rgba(190, 24, 93, 0.15);
            transition: all 0.3s ease;
        }

        .stage-thumb.center {
            width: 90px;
            transform: scale(1.08);
            border-color: #F43F5E;
            box-shadow: 0 12px 25px rgba(244, 63, 94, 0.35);
            z-index: 2;
        }

        .exhibit-card:hover .stage-thumb.center {
            transform: scale(1.15);
        }

        .exhibit-body {
            padding: 1.65rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex: 1;
            justify-content: space-between;
        }

        .exhibit-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.75rem;
        }

        .exhibit-theme-badge {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #BE185D;
        }

        .exhibit-title {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 700;
            color: #831843;
            line-height: 1.25;
        }

        .exhibit-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 1rem;
            border-top: 1.5px dashed #FCE7F3;
        }

        .btn-launch-stream {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #F43F5E, #EC4899);
            color: #FFFFFF;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 0.88rem;
            padding: 0.6rem 1.4rem;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.35);
        }

        .btn-launch-stream:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.5);
        }

        /* VIEW 2: POSTER WALL */
        .poster-wall-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.25rem;
        }

        .wall-item {
            border-radius: 16px;
            overflow: hidden;
            background: #FFFFFF;
            border: 1.5px solid #FCE7F3;
            aspect-ratio: 1 / 3;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 18px rgba(244, 114, 182, 0.12);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .wall-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .wall-item:hover {
            transform: translateY(-8px) scale(1.04);
            border-color: #F43F5E;
            box-shadow: 0 20px 35px rgba(244, 63, 94, 0.3);
            z-index: 10;
        }

        .wall-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(131, 24, 67, 0.95) 45%);
            padding: 1.5rem 0.75rem 0.75rem;
            color: #FFFFFF;
            font-size: 0.78rem;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .wall-item:hover .wall-caption {
            opacity: 1;
        }

        /* ========================================================
           READER VIEW (DOOM-SCROLL WITH IDENTICAL AUTO-HIDE NAV)
           ======================================================== */
        #readerView {
            display: none;
            width: 100%;
            min-height: 100vh;
            background-color: #180914;
        }

        .reader-nav {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            background: rgba(36, 12, 30, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            border: 1px solid rgba(244, 114, 182, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(244, 114, 182, 0.2);
            max-width: calc(100vw - 20px); box-sizing: border-box;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s ease;
        }

        .reader-nav.nav-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            transform: translateX(-50%) translateY(-24px) !important;
        }

        .nav-back-btn, .nav-fullscreen-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.15s ease;
        }

        .nav-back-btn:hover, .nav-fullscreen-btn:hover {
            background: rgba(244, 63, 94, 0.4);
            border-color: #FB7185;
        }

        .nav-title-text {
            font-size: 0.88rem;
            font-weight: 700;
            color: #FFFFFF;
            max-width: 240px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-picker-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #FFFFFF;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.15s ease;
        }

        .nav-picker-btn:hover, .nav-picker-btn.active {
            background: #FFFFFF;
            color: #831843;
        }

        .nav-picker-dropdown {
            position: absolute;
            top: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            background: #240C1E;
            border: 1.5px solid rgba(244, 114, 182, 0.3);
            border-radius: 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: none;
            z-index: 10001;
        }

        .nav-picker-dropdown.show {
            display: block;
        }

        .nav-picker-header {
            padding: 0.55rem 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.72rem;
            font-weight: 700;
            color: #F472B6;
            display: flex;
            justify-content: space-between;
        }

        .picker-total-badge {
            background: rgba(244, 63, 94, 0.3);
            color: #FFFFFF;
            padding: 0.1rem 0.45rem;
            border-radius: 9999px;
            font-size: 0.68rem;
        }

        .nav-picker-list {
            max-height: 240px;
            overflow-y: auto;
            padding: 0.3rem 0;
        }

        .nav-picker-list::-webkit-scrollbar {
            width: 5px;
        }
        .nav-picker-list::-webkit-scrollbar-thumb {
            background: rgba(244, 114, 182, 0.3);
            border-radius: 4px;
        }

        .nav-picker-item {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.5rem 0.85rem;
            color: #CBD5E1;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-picker-item:hover {
            background: rgba(244, 114, 182, 0.15);
            color: #FFFFFF;
        }

        .nav-picker-item.active {
            background: linear-gradient(135deg, #F43F5E, #EC4899);
            color: #FFFFFF;
            font-weight: 700;
        }

        .picker-item-num {
            font-size: 0.7rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: #F472B6;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
        }

        .nav-picker-item.active .picker-item-num {
            background: rgba(255, 255, 255, 0.25);
            color: #FFFFFF;
        }

        .picker-item-title {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .restore-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: rgba(36, 12, 30, 0.95);
            color: #F472B6;
            border: 1.5px solid rgba(244, 114, 182, 0.4);
            padding: 0.6rem 1.4rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(244, 114, 182, 0.3);
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .restore-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .doom-feed {
            width: 100%;
            display: flex;
            flex-direction: column;
            background-color: #180914;
        }

        .article-frame {
            width: 100%;
            aspect-ratio: 1 / 3;
            background-color: #240C1E;
            border-bottom: 2px solid #180914;
            overflow: hidden;
        }

        .article-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.2s ease-out;
        }

        .article-img.is-loaded {
            opacity: 1;
        }
    </style>
</head>
<body class="view-home">
    <div id="homeView">
        <div class="container">
            <!-- 3D SPATIAL HERO -->
            <section class="spatial-hero">
                <div class="hero-left">
                    <div class="hero-badge">
                        <span>839 INFOGRAPHICS • COMPUTER SCIENCE &amp; TECH</span>
                    </div>
                    <h1 class="hero-title">Museum of <span>Computing</span> &amp; AI</h1>
                    <p class="hero-desc">
                        Penjelajahan visual untuk 839 materi sains komputer, kecerdasan buatan, arsitektur data, dan keamanan siber.
                    </p>
                </div>

                <!-- 3D POSTER DECK -->
                <div class="poster-deck-3d" id="heroPosterDeck"></div>
            </section>

            <!-- TOOLBAR: VIEW SWITCHER & SEARCH -->
            <div class="controls-toolbar">
                <div class="view-tabs">
                    <button type="button" class="view-tab-btn active" id="tabExhibits" onclick="switchView('exhibits');">
                        <span>Visual Exhibits (31)</span>
                    </button>
                    <button type="button" class="view-tab-btn" id="tabWall" onclick="switchView('wall');">
                        <span>Poster Wall (839)</span>
                    </button>
                </div>

                <div class="search-pill-box">
                    <span style="font-size: 0.9rem; opacity: 0.7;">🔍</span>
                    <input type="text" id="matrixSearchInput" class="search-pill-input" placeholder="Cari materi, algoritma, atau konsep...">
                </div>
            </div>

            <!-- CATEGORY CAPSULES -->
            <div class="category-capsules" id="categoryCapsules"></div>

            <!-- VIEW 1: EXHIBIT SHOWCASE -->
            <main class="exhibits-grid" id="exhibitsGrid"></main>

            <!-- VIEW 2: POSTER WALL -->
            <main class="poster-wall-grid" id="posterWallGrid"></main>
        </div>
    </div>

    <!-- READER VIEW -->
    <div id="readerView">
        <nav class="reader-nav" id="readerNav" onclick="event.stopPropagation();">
            <button type="button" class="nav-back-btn" onclick="closeReader();">
                <span>← Kembali</span>
            </button>
            <span class="nav-title-text" id="navFolderTitle">Judul Folder</span>

            <!-- Jump Picker Dropdown -->
            <div style="position: relative;">
                <button type="button" class="nav-picker-btn" id="navPickerBtn" onclick="togglePickerDropdown();">
                    <span id="navPickerLabel">#1 Judul Artikel</span>
                    <span>▾</span>
                </button>
                <div class="nav-picker-dropdown" id="navPickerDropdown">
                    <div class="nav-picker-header">
                        <span>PILIH ARTIKEL</span>
                        <span class="picker-total-badge" id="pickerTotalBadge">0 Item</span>
                    </div>
                    <div class="nav-picker-list" id="navPickerList"></div>
                </div>
            </div>

            <button type="button" class="nav-fullscreen-btn" onclick="toggleFullScreen();">
                <span>⛶</span>
            </button>
        </nav>
        <main class="doom-feed" id="doomFeed"></main>
        <div class="restore-toast" id="restoreToast">
            <span id="restoreToastText">Melanjutkan membaca...</span>
        </div>
    </div>

    <script src="../data.js"></script>
    <script>
        const libraryData = (window.libraryData || []).map(f => {
            if (f && f.images) {
                f.images.forEach(img => {
                    if (img && img.url && !img.url.startsWith('../')) img.url = '../' + img.url;
                });
            }
            return f;
        });

        const folderMap = {};
        libraryData.forEach(f => { folderMap[f.rawName] = f; });

        const homeView = document.getElementById('homeView');
        const readerView = document.getElementById('readerView');
        const heroPosterDeck = document.getElementById('heroPosterDeck');
        const exhibitsGrid = document.getElementById('exhibitsGrid');
        const posterWallGrid = document.getElementById('posterWallGrid');
        const categoryCapsules = document.getElementById('categoryCapsules');
        const matrixSearchInput = document.getElementById('matrixSearchInput');
        const doomFeed = document.getElementById('doomFeed');
        const nav = document.getElementById('readerNav');
        const navFolderTitle = document.getElementById('navFolderTitle');
        const navPickerBtn = document.getElementById('navPickerBtn');
        const navPickerDropdown = document.getElementById('navPickerDropdown');
        const navPickerLabel = document.getElementById('navPickerLabel');
        const navPickerList = document.getElementById('navPickerList');
        const pickerTotalBadge = document.getElementById('pickerTotalBadge');

        let currentActiveFolder = null;
        let homeScrollY = 0;
        let currentView = 'exhibits';
        let selectedCategory = '';

        function showNav() { nav.classList.remove('nav-hidden'); }
        function hideNav() { 
            nav.classList.add('nav-hidden'); 
            closePickerDropdown();
        }
        function toggleNav() {
            if (nav.classList.contains('nav-hidden')) showNav();
            else hideNav();
        }

        function togglePickerDropdown() {
            navPickerDropdown.classList.toggle('show');
            navPickerBtn.classList.toggle('active');
        }

        function closePickerDropdown() {
            if (navPickerDropdown) navPickerDropdown.classList.remove('show');
            if (navPickerBtn) navPickerBtn.classList.remove('active');
        }

        function updateActiveArticleState(artNum) {
            if (!currentActiveFolder || !currentActiveFolder.images) return;
            currentActiveArtIdx = artNum;
            const curItem = currentActiveFolder.images[artNum - 1];
            if (curItem && navPickerLabel) {
                navPickerLabel.textContent = `#${artNum} ${curItem.cleanTitle}`;
            }

            if (navPickerList) {
                const items = navPickerList.querySelectorAll('.nav-picker-item');
                items.forEach(it => {
                    if (parseInt(it.getAttribute('data-idx'), 10) === artNum) {
                        it.classList.add('active');
                        it.scrollIntoView({ block: 'nearest' });
                    } else {
                        it.classList.remove('active');
                    }
                });
            }
        }

        function init() {
            const samplePosters = [
                libraryData[0]?.images[0],
                libraryData[7]?.images[0],
                libraryData[14]?.images[0],
                libraryData[20]?.images[0],
                libraryData[26]?.images[0],
            ].filter(Boolean);

            let deckHtml = '';
            samplePosters.forEach((p, idx) => {
                const parentFolder = libraryData.find(f => f.images.some(img => img.url === p.url));
                deckHtml += `
                    <div class="deck-card c${idx + 1}" onclick="openReader('${parentFolder.rawName}');">
                        <img src="${p.url}" alt="${p.cleanTitle}">
                    </div>
                `;
            });
            heroPosterDeck.innerHTML = deckHtml;

            const codes = [...new Set(libraryData.map(f => f.themeCode))];
            let capHtml = `<button class="capsule-btn active" data-theme="">✨ Semua (${libraryData.length})</button>`;
            codes.forEach(c => {
                const sample = libraryData.find(f => f.themeCode === c);
                capHtml += `<button class="capsule-btn" data-theme="${c}">${sample.theme.icon} ${sample.themeShortTitle}</button>`;
            });
            categoryCapsules.innerHTML = capHtml;

            categoryCapsules.querySelectorAll('.capsule-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryCapsules.querySelectorAll('.capsule-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedCategory = btn.dataset.theme || '';
                    renderExhibits();
                    renderPosterWall();
                });
            });

            matrixSearchInput.addEventListener('input', () => {
                renderExhibits();
                renderPosterWall();
            });

            renderExhibits();
            renderPosterWall();
        }

        function renderExhibits() {
            const q = matrixSearchInput.value.trim().toLowerCase();
            let html = '';
            libraryData.forEach(f => {
                if (selectedCategory && f.themeCode !== selectedCategory) return;
                if (q && !f.displayName.toLowerCase().includes(q) && !f.images.some(img => img.cleanTitle.toLowerCase().includes(q))) return;

                const img1 = f.images[0]?.url || '';
                const img2 = f.images[1]?.url || img1;
                const img3 = f.images[2]?.url || img1;

                html += `
                    <article class="exhibit-card">
                        <div class="exhibit-poster-stage" onclick="openReader('${f.rawName}');">
                            <img class="stage-thumb" src="${img1}" alt="Poster" loading="lazy">
                            <img class="stage-thumb center" src="${img2}" alt="Poster" loading="lazy">
                            <img class="stage-thumb" src="${img3}" alt="Poster" loading="lazy">
                        </div>
                        <div class="exhibit-body">
                            <div>
                                <div class="exhibit-meta-row">
                                    <span class="exhibit-theme-badge">${f.code} • ${f.themeShortTitle}</span>
                                    <span style="color: #BE185D; font-weight:700;">#${f.number}</span>
                                </div>
                                <h2 class="exhibit-title">${escapeHtml(f.displayName)}</h2>
                            </div>
                            <div class="exhibit-footer">
                                <span style="font-family: var(--font-mono); font-size: 0.8rem; color: #9D174D; font-weight:600;">${f.imageCount} Visual Posters</span>
                                <button type="button" class="btn-launch-stream" onclick="openReader('${f.rawName}');">
                                    <span>Buka Stream</span>
                                </button>
                            </div>
                        </div>
                    </article>
                `;
            });
            exhibitsGrid.innerHTML = html || '<div style="padding:3rem; text-align:center; color:#9D174D;">Tidak ada hasil ditemukan.</div>';
        }

        function renderPosterWall() {
            const q = matrixSearchInput.value.trim().toLowerCase();
            let html = '';
            libraryData.forEach(f => {
                if (selectedCategory && f.themeCode !== selectedCategory) return;
                f.images.forEach((img, i) => {
                    if (q && !img.cleanTitle.toLowerCase().includes(q) && !f.displayName.toLowerCase().includes(q)) return;
                    html += `
                        <div class="wall-item" onclick="openReader('${f.rawName}', ${i + 1});">
                            <img src="${img.url}" alt="${escapeHtml(img.cleanTitle)}" loading="lazy">
                            <div class="wall-caption">
                                <div>${escapeHtml(img.cleanTitle)}</div>
                                <div style="font-size:0.68rem; color:#FB7185; font-family:var(--font-mono);">${f.code} #${i + 1}</div>
                            </div>
                        </div>
                    `;
                });
            });
            posterWallGrid.innerHTML = html;
        }

        function switchView(mode) {
            currentView = mode;
            document.getElementById('tabExhibits').classList.toggle('active', mode === 'exhibits');
            document.getElementById('tabWall').classList.toggle('active', mode === 'wall');
            exhibitsGrid.style.display = mode === 'exhibits' ? 'grid' : 'none';
            posterWallGrid.style.display = mode === 'wall' ? 'grid' : 'none';
        }

        // Independent Position Store per Folder (LocalStorage)
        let folderPositions = {};
        let currentActiveArtIdx = 1;
        let isRestoringScroll = false;
        let saveScrollTimeout = null;

        function loadAllPositions() {
            let loaded = {};
            try {
                const raw = localStorage.getItem('vis_tech_positions');
                if (raw) loaded = JSON.parse(raw) || {};
            } catch(e) {}
            return loaded;
        }
        folderPositions = loadAllPositions();

        function saveCurrentPosition() {
            if (!currentActiveFolder || isRestoringScroll) return;
            const fKey = currentActiveFolder.rawName;
            const artIdx = currentActiveArtIdx || 1;
            const scrollY = Math.round(window.scrollY);

            folderPositions[fKey] = {
                artIdx: artIdx,
                scrollY: scrollY,
                total: currentActiveFolder.imageCount,
                ts: Date.now()
            };
            try { localStorage.setItem('vis_tech_positions', JSON.stringify(folderPositions)); } catch(e) {}
        }

        window.addEventListener('beforeunload', () => saveCurrentPosition());
        window.addEventListener('pagehide', () => saveCurrentPosition());

        function showToast(msg) {
            const toast = document.getElementById('restoreToast');
            const toastText = document.getElementById('restoreToastText');
            if (toast && toastText) {
                toastText.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 2500);
            }
        }

        // Smart Proactive Image Preloader & Lazy Observer
        let imageObserver = null;
        const preloadedUrls = new Set();
        function preloadImageUrl(url) {
            if (!url || preloadedUrls.has(url)) return;
            preloadedUrls.add(url);
            const temp = new Image();
            temp.decoding = 'async';
            temp.src = url;
        }

        function loadFrameImage(idx) {
            if (!currentActiveFolder || !currentActiveFolder.images) return;
            if (idx < 1 || idx > currentActiveFolder.images.length) return;

            const frame = document.getElementById('art-' + idx);
            if (!frame) return;

            const img = frame.querySelector('img.article-img');
            if (!img) return;

            const realSrc = img.getAttribute('data-src');
            if (!realSrc) return;

            if (img.src !== realSrc) {
                img.src = realSrc;
            }

            if (img.complete && img.naturalWidth > 0) {
                img.classList.add('is-loaded');
            } else {
                img.onload = () => { img.classList.add('is-loaded'); };
            }
        }

        function preloadRunway(currentIdx) {
            if (!currentActiveFolder || !currentActiveFolder.images) return;
            const total = currentActiveFolder.images.length;
            const start = Math.max(1, currentIdx - 2);
            const end = Math.min(total, currentIdx + 6);

            for (let i = start; i <= end; i++) {
                loadFrameImage(i);
                const item = currentActiveFolder.images[i - 1];
                if (item && item.url) preloadImageUrl(item.url);
            }
        }

        function setupLazyObserver() {
            const lazyImages = doomFeed.querySelectorAll('.lazy-img');
            if ('IntersectionObserver' in window) {
                if (imageObserver) imageObserver.disconnect();
                imageObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            const idx = parseInt(img.closest('.article-frame')?.getAttribute('data-index'), 10);
                            if (idx) preloadRunway(idx);
                        }
                    });
                }, { rootMargin: '600px 0px' });

                lazyImages.forEach(img => imageObserver.observe(img));
            } else {
                for (let i = 1; i <= Math.min(10, currentActiveFolder.images.length); i++) {
                    loadFrameImage(i);
                }
            }
        }

        function jumpToArticle(artNum, behavior = 'smooth') {
            const frame = document.getElementById('art-' + artNum);
            if (frame) {
                preloadRunway(artNum);
                frame.scrollIntoView({ behavior: behavior, block: 'start' });
                updateActiveArticleState(artNum);
            }
        }

        function openReader(rawName, targetIdx) {
            const f = folderMap[rawName];
            if (!f) return;
            homeScrollY = window.scrollY;
            currentActiveFolder = f;

            document.body.className = 'view-reader';
            homeView.style.display = 'none';
            readerView.style.display = 'block';
            navFolderTitle.textContent = f.displayName;

            hideNav();

            if (pickerTotalBadge) pickerTotalBadge.textContent = `${f.imageCount} Poster`;
            if (navPickerList) {
                navPickerList.innerHTML = '';
                f.images.forEach((img, idx) => {
                    const itemNum = idx + 1;
                    const div = document.createElement('div');
                    div.className = 'nav-picker-item' + (itemNum === 1 ? ' active' : '');
                    div.setAttribute('data-idx', itemNum);
                    div.innerHTML = `<span class="picker-item-num">#${itemNum}</span><span class="picker-item-title">${escapeHtml(img.cleanTitle)}</span>`;
                    div.onclick = (e) => {
                        e.stopPropagation();
                        jumpToArticle(itemNum);
                        closePickerDropdown();
                    };
                    navPickerList.appendChild(div);
                });
            }

            let feed = '';
            f.images.forEach((img, i) => {
                feed += `
                    <section class="article-frame" id="art-${i+1}" data-index="${i+1}">
                        <img 
                            class="article-img lazy-img" 
                            data-src="${img.url}" 
                            alt="${escapeHtml(img.cleanTitle)}" 
                            loading="lazy" 
                            decoding="async"
                        >
                    </section>
                `;
            });
            doomFeed.innerHTML = feed;

            setupLazyObserver();

            let savedPos = folderPositions[f.rawName];
            let startIdx = targetIdx > 0 ? targetIdx : (savedPos ? savedPos.artIdx : 1);
            preloadRunway(startIdx);

            if (targetIdx > 0) {
                jumpToArticle(targetIdx, 'instant');
            } else if (savedPos && savedPos.scrollY > 0) {
                isRestoringScroll = true;
                setTimeout(() => {
                    window.scrollTo({ top: savedPos.scrollY, behavior: 'instant' });
                    preloadRunway(savedPos.artIdx);
                    updateActiveArticleState(savedPos.artIdx);
                    showToast(`Melanjutkan dari artikel #${savedPos.artIdx}`);
                    setTimeout(() => { isRestoringScroll = false; }, 300);
                }, 50);
            } else {
                window.scrollTo({ top: 0, behavior: 'instant' });
                updateActiveArticleState(1);
            }
        }

        function closeReader() {
            if (currentActiveFolder) saveCurrentPosition();
            currentActiveFolder = null;
            closePickerDropdown();

            if (imageObserver) {
                imageObserver.disconnect();
                imageObserver = null;
            }

            document.body.className = 'view-home';
            readerView.style.display = 'none';
            homeView.style.display = 'block';
            window.scrollTo({ top: homeScrollY, behavior: 'instant' });
        }

        window.addEventListener('scroll', () => {
            if (!currentActiveFolder || isRestoringScroll) return;
            if (!nav.classList.contains('nav-hidden')) {
                hideNav();
            }
            const frames = doomFeed.querySelectorAll('.article-frame');
            const midY = window.innerHeight * 0.35;
            for (let i = 0; i < frames.length; i++) {
                const rect = frames[i].getBoundingClientRect();
                if (rect.top <= midY && rect.bottom >= midY) {
                    const idx = parseInt(frames[i].dataset.index, 10);
                    if (idx !== currentActiveArtIdx) {
                        updateActiveArticleState(idx);
                        preloadRunway(idx);
                    }
                    break;
                }
            }

            if (saveScrollTimeout) clearTimeout(saveScrollTimeout);
            saveScrollTimeout = setTimeout(() => {
                if (!currentActiveFolder || isRestoringScroll) return;
                saveCurrentPosition();
            }, 100);
        }, { passive: true });

        document.addEventListener('click', (e) => {
            if (!currentActiveFolder) return;
            if (e.target.closest('#readerNav') || e.target.closest('#restoreToast')) return;
            if (e.clientY <= 90) {
                toggleNav();
            } else {
                hideNav();
            }
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
            else document.exitFullscreen().catch(()=>{});
        }
        function escapeHtml(s) { return s ? s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''; }

        init();
    </script>
</body>
</html>
