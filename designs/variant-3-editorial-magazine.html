<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>VIS Tech Journal • Modernist Editorial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --bg: #0F1218;
            --surface: #171B24;
            --surface-hover: #1E232E;
            --border: #262D3D;
            --border-light: rgba(255, 255, 255, 0.12);
            --text-heading: #FFFFFF;
            --text-body: #94A3B8;
            --text-muted: #64748B;
            --accent: #10B981;
            --accent-light: #34D399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--text-body);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body.view-reader {
            background: #080A0F !important;
        }

        .container {
            max-width: 1320px;
            margin: 0 auto;
            padding: 3rem 1.5rem 5rem;
        }

        /* EDITORIAL HEADER */
        .masthead {
            border-bottom: 2px solid var(--border);
            padding-bottom: 2.5rem;
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .masthead-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .issue-tag {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-light);
            padding: 0.25rem 0.65rem;
            border-radius: 4px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-weight: 700;
        }

        .masthead-title {
            font-family: var(--font-display);
            font-size: clamp(2.6rem, 6vw, 4.5rem);
            font-weight: 700;
            color: var(--text-heading);
            letter-spacing: -0.04em;
            line-height: 1.05;
        }

        .masthead-lead {
            font-size: 1.15rem;
            color: #CBD5E1;
            max-width: 780px;
            line-height: 1.6;
        }

        /* SECTION NAV & SEARCH */
        .toolbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .editorial-search {
            flex: 1;
            min-width: 280px;
            max-width: 480px;
            position: relative;
        }

        .editorial-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.65rem 1rem 0.65rem 2.4rem;
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: #FFFFFF;
            outline: none;
            transition: border-color 0.2s;
        }

        .editorial-input:focus {
            border-color: var(--accent-light);
        }

        .search-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .editorial-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        .ed-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-body);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .ed-chip:hover {
            background: var(--surface-hover);
            color: #FFFFFF;
        }

        .ed-chip.active {
            background: var(--accent);
            color: #FFFFFF;
            border-color: var(--accent);
        }

        /* EDITORIAL BENTO GRID */
        .editorial-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.75rem;
        }

        .ed-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
            position: relative;
        }

        .ed-card:hover {
            border-color: var(--border-light);
            background: var(--surface-hover);
            transform: translateY(-4px);
        }

        .ed-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
        }

        .ed-card-num {
            background: rgba(255, 255, 255, 0.06);
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .ed-card-domain {
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .ed-card-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-heading);
            line-height: 1.25;
            margin-bottom: 1.25rem;
        }

        .ed-card-meta {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            font-size: 0.8rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-read-journal {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-read-journal:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* READER */
        #readerView {
            display: none;
            width: 100%;
            min-height: 100vh;
            background: #080A0F;
        }

        .reader-nav {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #171B24;
            padding: 0.45rem 1.25rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: all 0.3s;
        }

        .reader-nav.nav-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            transform: translateX(-50%) translateY(-24px) !important;
        }

        .doom-feed {
            width: 100%;
            display: flex;
            flex-direction: column;
            background: #080A0F;
        }

        .article-frame {
            width: 100%;
            aspect-ratio: 1 / 3;
            background: #10141C;
            border-bottom: 2px solid #080A0F;
            overflow: hidden;
        }

        .article-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.2s ease-out;
        }

        .article-img.is-loaded {
            opacity: 1;
        }
    </style>
</head>
<body class="view-home">
    <div id="homeView">
        <div class="container">
            <header class="masthead">
                <div class="masthead-top">
                    <span>VIS Tech Knowledge Repository</span>
                    <span class="issue-tag">Edition 2026</span>
                    <span>31 Topics • 839 Visual Posters</span>
                </div>
                <h1 class="masthead-title">Computer Science &amp; Technology</h1>
                <p class="masthead-lead">Panduan visual ensiklopedis mengenai sejarah komputasi, kecerdasan buatan, arsitektur data, algoritma, dan rekayasa keamanan digital.</p>
            </header>

            <div class="toolbar-row">
                <div class="editorial-search">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="edSearchInput" class="editorial-input" placeholder="Cari materi atau konsep...">
                </div>
                <div class="editorial-chips" id="editorialChips"></div>
            </div>

            <main class="editorial-grid" id="editorialGrid"></main>
        </div>
    </div>

    <!-- READER -->
    <div id="readerView">
        <nav class="reader-nav" id="readerNav">
            <button type="button" style="background:none; border:none; color:#FFFFFF; font-weight:700; cursor:pointer;" onclick="closeReader();">← Kembali</button>
            <span style="font-family: var(--font-display); font-weight: 700; color:#FFFFFF;" id="navFolderTitle">Judul Folder</span>
        </nav>
        <main class="doom-feed" id="doomFeed"></main>
    </div>

    <script src="../data.js"></script>
    <script>
        const libraryData = (window.libraryData || []).map(f => {
            if (f && f.images) {
                f.images.forEach(img => {
                    if (img && img.url && !img.url.startsWith('../')) img.url = '../' + img.url;
                });
            }
            return f;
        });

        const folderMap = {};
        libraryData.forEach(f => { folderMap[f.rawName] = f; });

        const homeView = document.getElementById('homeView');
        const readerView = document.getElementById('readerView');
        const editorialGrid = document.getElementById('editorialGrid');
        const editorialChips = document.getElementById('editorialChips');
        const edSearchInput = document.getElementById('edSearchInput');
        const doomFeed = document.getElementById('doomFeed');
        const navFolderTitle = document.getElementById('navFolderTitle');

        let currentActiveFolder = null;
        let homeScrollY = 0;
        let selectedTheme = '';

        function init() {
            // Chips
            const codes = [...new Set(libraryData.map(f => f.themeCode))];
            let chips = `<button class="ed-chip active" data-theme="">Semua (${libraryData.length})</button>`;
            codes.forEach(c => {
                const s = libraryData.find(f => f.themeCode === c);
                chips += `<button class="ed-chip" data-theme="${c}">${s.theme.icon} ${s.themeShortTitle}</button>`;
            });
            editorialChips.innerHTML = chips;

            // Render Cards
            renderCards();

            // Filter clicks
            editorialChips.querySelectorAll('.ed-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    editorialChips.querySelectorAll('.ed-chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedTheme = btn.dataset.theme || '';
                    renderCards();
                });
            });

            edSearchInput.addEventListener('input', () => {
                renderCards();
            });
        }

        function renderCards() {
            const q = edSearchInput.value.trim().toLowerCase();
            let html = '';
            libraryData.forEach(f => {
                if (selectedTheme && f.themeCode !== selectedTheme) return;
                if (q && !f.displayName.toLowerCase().includes(q) && !f.images.some(img => img.cleanTitle.toLowerCase().includes(q))) return;

                const estReadMin = Math.round(f.imageCount * 0.4);
                html += `
                    <article class="ed-card">
                        <div>
                            <div class="ed-card-header">
                                <span class="ed-card-num">#${f.number}</span>
                                <span class="ed-card-domain" style="color:${f.theme.accent};">${f.code} • ${f.themeShortTitle}</span>
                                <span>${f.theme.icon}</span>
                            </div>
                            <h2 class="ed-card-title">${escapeHtml(f.displayName)}</h2>
                        </div>
                        <div>
                            <div class="ed-card-meta">
                                <span>📊 ${f.imageCount} Visual Posters</span>
                                <span>⏱️ ~${estReadMin} mnt baca</span>
                            </div>
                            <div class="btn-read-journal" onclick="openReader('${f.rawName}');">
                                <span>Buka Continuous Stream</span>
                                <span>→</span>
                            </div>
                        </div>
                    </article>
                `;
            });
            editorialGrid.innerHTML = html || '<div style="padding: 3rem; text-align:center; color:#64748B;">Tidak ada materi yang sesuai filter.</div>';
        }

        // Visibility Controls (Default: lenyap, toggle via tap/click)
        const nav = document.getElementById('readerNav');
        function showNav() { nav.classList.remove('nav-hidden'); }
        function hideNav() { nav.classList.add('nav-hidden'); }
        function toggleNav() {
            if (nav.classList.contains('nav-hidden')) showNav();
            else hideNav();
        }

        function openReader(rawName) {
            const f = folderMap[rawName];
            if (!f) return;
            homeScrollY = window.scrollY;
            currentActiveFolder = f;
            document.body.className = 'view-reader';
            homeView.style.display = 'none';
            readerView.style.display = 'block';
            navFolderTitle.textContent = f.displayName;

            hideNav();

            let feed = '';
            f.images.forEach((img, i) => {
                feed += `
                    <section class="article-frame" id="art-${i+1}" data-index="${i+1}">
                        <img class="article-img" data-src="${img.url}" alt="${img.cleanTitle}" loading="lazy">
                    </section>
                `;
            });
            doomFeed.innerHTML = feed;
            preload(1);
            window.scrollTo({ top: 0, behavior: 'instant' });
        }

        function closeReader() {
            currentActiveFolder = null;
            document.body.className = 'view-home';
            readerView.style.display = 'none';
            homeView.style.display = 'block';
            window.scrollTo({ top: homeScrollY, behavior: 'instant' });
        }

        function preload(idx) {
            if (!currentActiveFolder) return;
            for (let i = Math.max(1, idx - 2); i <= Math.min(currentActiveFolder.images.length, idx + 6); i++) {
                const fr = document.getElementById('art-' + i);
                if (fr) {
                    const img = fr.querySelector('img');
                    if (img && img.dataset.src && img.src !== img.dataset.src) {
                        img.src = img.dataset.src;
                        img.onload = () => img.classList.add('is-loaded');
                    }
                }
            }
        }

        window.addEventListener('scroll', () => {
            if (!currentActiveFolder) return;
            if (!nav.classList.contains('nav-hidden')) {
                hideNav();
            }
            const frames = doomFeed.querySelectorAll('.article-frame');
            const midY = window.innerHeight * 0.35;
            for (let i = 0; i < frames.length; i++) {
                const rect = frames[i].getBoundingClientRect();
                if (rect.top <= midY && rect.bottom >= midY) {
                    const idx = parseInt(frames[i].dataset.index, 10);
                    preload(idx);
                    break;
                }
            }
        }, { passive: true });

        document.addEventListener('click', (e) => {
            if (!currentActiveFolder) return;
            if (e.target.closest('#readerNav')) return;
            if (e.clientY <= 90) {
                toggleNav();
            } else {
                hideNav();
            }
        });

        function escapeHtml(s) { return s ? s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''; }

        init();
    </script>
</body>
</html>
